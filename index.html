<!DOCTYPE html>
<html lang="pt-BR" id="html">
<head>
  <meta charset="UTF-8">
  <title>Drivn</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="drivn-app-icon.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Modak&family=Oi&family=Oswald:wght@200..700&family=Supermercado+One&display=swap" rel="stylesheet">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>

  <div id="barra-nav">
    <img src="./assets/a16698b6-9e1c-49af-9a21-8df69f720cb3 (1).jpg" alt="Logo" id="Logo-barra">
    <div id="Lingua-config">
      <button id="Lingua" onclick="toggleLang()"></button>
    </div>
    <img id="foto-usuario">
    <p id="nome-usuario"></p>
    <button id="btn-sair" data-code="Sair" data-pt="Sair" data-en="Logout" style="display:none" onclick="sair()"></button>
    <button id="btn-salvar" data-code="Salvar Conta" data-pt="Salvar Conta" data-en="Save Account" style="display:none" onclick="salvarConta()"></button>
  </div>

  <div id="Tela-login">
    <div id="caixa-login">
      <img src="./assets/a16698b6-9e1c-49af-9a21-8df69f720cb3 (1).jpg" alt="Logo" id="Logo-login">
      <h1>Drivn</h1>
      <p data-code="Organize sua mente. Domine seu tempo." data-pt="Organize sua mente. Domine seu tempo." data-en="Organize your mind. Master your time."></p>
      <p data-code="Entrar com Google:" data-pt="Entrar com Google:" data-en="Sign in with Google:"></p>
      <div id="g_id_onload"
        data-client_id="1053709473946-e9brjikoia5rn2d519nvcb89l8kid7h5.apps.googleusercontent.com"
        data-callback="handleLogin">
      </div>
      <div class="g_id_signin"
        data-type="standard"
        data-locale="pt-BR">
      </div>
    </div>
  </div>

  <div id="Tela-principal" style="display:none"></div>

<script src="https://accounts.google.com/gsi/client" async></script>
<script>
  // ─── Estado global ────────────────────────────────────────────────────────
  let lang = 'pt-BR';
  let emailUsuario = '';

  // ─── Inicialização ────────────────────────────────────────────────────────
  window.onload = function () {
    initLang();
    tryRestoreSession();
  };

  function tryRestoreSession() {
    const nome  = localStorage.getItem('nome');
    const foto  = localStorage.getItem('foto');
    const email = localStorage.getItem('email');

    if (nome && foto && email) {
      emailUsuario = email;
      document.getElementById('nome-usuario').textContent = nome;
      document.getElementById('foto-usuario').src = foto;
      showScreen('principal');
    }
  }

  // ─── Autenticação Google ──────────────────────────────────────────────────
  function handleLogin(response) {
    const usuario = decodeJwtPayload(response.credential);
    if (!usuario?.email || !usuario?.name || !usuario?.picture) {
      console.error('Resposta de login inválida:', usuario);
      return;
    }

    emailUsuario = usuario.email;
    document.getElementById('nome-usuario').textContent = usuario.name;
    document.getElementById('foto-usuario').src = usuario.picture;
    showScreen('principal');
  }

  /**
   * Decodifica o payload de um JWT.
   * O atob nativo exige padding correto (múltiplo de 4).
   */
  function decodeJwtPayload(token) {
    try {
      const base64 = token.split('.')[1]
        .replace(/-/g, '+')
        .replace(/_/g, '/');
      const padded = base64.padEnd(base64.length + (4 - base64.length % 4) % 4, '=');
      return JSON.parse(atob(padded));
    } catch (err) {
      console.error('Falha ao decodificar JWT:', err);
      return null;
    }
  }

  function sair() {
    google.accounts.id.revoke(emailUsuario, () => {
      google.accounts.id.disableAutoSelect();
      limparSessao();
      showScreen('login');
    });
  }

  function limparSessao() {
    localStorage.removeItem('nome');
    localStorage.removeItem('foto');
    localStorage.removeItem('email');
    emailUsuario = '';
  }

  // ─── Persistência ─────────────────────────────────────────────────────────
  function salvarConta() {
    const nome = document.getElementById('nome-usuario').textContent;
    const foto = document.getElementById('foto-usuario').src;

    if (!emailUsuario || !nome || !foto) {
      alert('Nenhuma conta ativa para salvar.');
      return;
    }

    localStorage.setItem('nome', nome);
    localStorage.setItem('foto', foto);
    localStorage.setItem('email', emailUsuario);
    alert('Conta salva! Na próxima vez você já entra direto.');
  }

  // ─── UI ───────────────────────────────────────────────────────────────────
  function showScreen(tela) {
    const isLogado = tela === 'principal';
    document.getElementById('Tela-login').style.display     = isLogado ? 'none'         : 'block';
    document.getElementById('Tela-principal').style.display = isLogado ? 'block'        : 'none';
    document.getElementById('btn-sair').style.display       = isLogado ? 'inline-block' : 'none';
    document.getElementById('btn-salvar').style.display     = isLogado ? 'inline-block' : 'none';
  }

  // ─── Idioma ───────────────────────────────────────────────────────────────
  function initLang() {
    // Aplica o idioma inicial sem precisar chamar toggleLang duas vezes
    document.getElementById('html').lang = lang;
    document.querySelectorAll('[data-code]').forEach(el => {
      el.textContent = lang === 'pt-BR' ? el.dataset.pt : el.dataset.en;
    });
    document.getElementById('Lingua').textContent =
      lang === 'pt-BR' ? '🇺🇸 English' : '🇧🇷 Português';
  }

  function toggleLang() {
    lang = lang === 'pt-BR' ? 'en' : 'pt-BR';
    initLang();
  }
</script>
</body>
</html>
